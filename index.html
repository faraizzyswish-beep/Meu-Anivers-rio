<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva para o Aniversário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            background: #111 url('Screenshot_20260925_205052_Google.jpg') no-repeat center center/cover;
            position: relative;
            overflow-x: hidden;
        }

        /* Camada escura de contraste */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        /* --- CANVAS DOS FOGOS DE ARTIFÍCIO --- */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* --- ANIMAÇÃO DOS BALÕES --- */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 3;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 52px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.85;
            animation: floatUp linear infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 14px;
            background: rgba(255, 255, 255, 0.6);
        }

        .balloon::before {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid inherit;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.85;
            }
            50% {
                transform: translateY(-60vh) rotate(15deg);
            }
            100% {
                transform: translateY(-120vh) rotate(-15deg);
                opacity: 0;
            }
        }

        /* --- AVISO DE CANCELADO (NO MEIO DO SITE) --- */
        .canceled-banner {
            position: relative;
            z-index: 5;
            text-align: center;
            background: rgba(30, 0, 0, 0.85);
            border: 2px solid #ff0000;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            max-width: 90%;
            width: 480px;
            margin: 10px 0;
        }

        .canceled-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 5px;
            animation: pulseWarning 1.5s infinite alternate;
        }

        .canceled-text {
            color: #ff0000;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 2px 2px 4px #000;
        }

        @keyframes pulseWarning {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* --- ESTRUTURA PRINCIPAL --- */
        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            color: #ffffff;
            padding: 30px 20px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 480px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #f3e5ab;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .box {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #d4af37;
            padding: 15px 8px;
            border-radius: 12px;
            flex: 1;
            min-width: 0;
        }

        .number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .label {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .number { font-size: 1.5rem; }
            .label { font-size: 0.65rem; }
            .canceled-icon { font-size: 3rem; }
            .canceled-text { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- CANVAS PARA FOGOS DE ARTIFÍCIO -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- CONTAINER PARA OS BALÕES -->
    <div class="balloon-container" id="balloonContainer"></div>

    <div class="container">
        <h1>Faltam para o meu aniversário</h1>
        <div class="countdown">
            <div class="box">
                <span class="number" id="days">00</span>
                <span class="label">Dias</span>
            </div>
            <div class="box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutos</span>
            </div>
            <div class="box">
                <span class="number" id="seconds">00</span>
                <span class="label">Segundos</span>
            </div>
        </div>
    </div>

    <!-- BANNER DE CANCELADO NO MEIO DO SITE -->
    <div class="canceled-banner">
        <span class="canceled-icon">⚠️</span>
        <div class="canceled-text">CANCELADO</div>
    </div>

    <script>
        // --- CONTAGEM REGRESSIVA ---
        const targetDate = new Date(2026, 9, 19, 0, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.container').innerHTML = '<h1>🎉 O GRANDE DIA CHEGOU! PARABÉNS! 🎂</h1>';
                clearInterval(interval);
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- GERADOR DE BALÕES CONTINUO ---
        const balloonColors = ['#d4af37', '#f3e5ab', '#ff4b5c', '#2ed573', '#1e90ff', '#eccc68'];
        const balloonContainer = document.getElementById('balloonContainer');

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            const randomColor = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            const randomLeft = Math.random() * 90 + 5;
            const randomDuration = Math.random() * 6 + 6;
            const randomSize = Math.random() * 15 + 35;

            balloon.style.backgroundColor = randomColor;
            balloon.style.left = randomLeft + 'vw';
            balloon.style.animationDuration = randomDuration + 's';
            balloon.style.width = randomSize + 'px';
            balloon.style.height = (randomSize * 1.3) + 'px';

            balloonContainer.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, randomDuration * 1000);
        }

        setInterval(createBalloon, 800);

        // --- ANIMAÇÃO DE FOGOS DE ARTIFÍCIO ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 8 + 2),
                    y: (Math.random() - 0.5) * (Math.random() * 8 + 2)
                };
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
        }

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1);
            const colors = ['#d4af37', '#f3e5ab', '#ffffff', '#ff4757', '#ffa502', '#2ed573'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = Math.floor(Math.random() * 30) + 40;

            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animateFireworks);
        }

        setInterval(createFirework, 1200);
        animateFireworks();
    </script>
</body>
</html>
